---

- name: Testing FRR OSPFV3 Networks
  hosts: localhost
  gather_facts: no
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ lookup('ansible.builtin.env', 'TEST_FIREWALL') }}"
      api_credential_file: "{{ lookup('ansible.builtin.env', 'TEST_API_KEY') }}"
      ssl_verify: false

  environment:
    HTTPS_PROXY: "{{ lookup('ansible.builtin.env', 'TEST_PROXY') | default('') }}"

  tasks:
    - name: Adding - removed in OPNsense 26.7
      oxlorg.opnsense.frr_ospf3_network:
        ip: '2001:db8::'
        mask: 64
        area: '0.0.0.0'
      register: opn1
      failed_when: >
        not opn1.failed or
        'OPNsense 26.7' not in opn1.msg
