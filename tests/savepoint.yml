---

- name: Testing Savepoints
  hosts: localhost
  gather_facts: no
  module_defaults:
    oxlorg.opnsense.savepoint:
      firewall: "{{ lookup('ansible.builtin.env', 'TEST_FIREWALL') }}"
      api_credential_file: "{{ lookup('ansible.builtin.env', 'TEST_API_KEY') }}"
      ssl_verify: false

  environment:
    HTTPS_PROXY: "{{ lookup('ansible.builtin.env', 'TEST_PROXY') | default('') }}"

  tasks:
    - name: Creating filter savepoint - removed in OPNsense 26.7
      oxlorg.opnsense.savepoint:
        action: 'create'
        controller: 'filter'
      register: opn1
      failed_when: >
        not opn1.failed or
        'OPNsense 26.7' not in opn1.msg
